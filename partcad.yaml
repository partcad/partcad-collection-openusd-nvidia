# PartCAD package: NVIDIA's Omniverse sample content as parts, served by a repository plugin.
#
# Published as //pub/collection/openusd/nvidia/assets: this package is
# //pub/collection/openusd/nvidia, and its one external dependency 'assets' is served
# by the nvidia_repo plugin - NVIDIA's Omniverse sample content: a child package
# per kind of asset (archvis-commercial, archvis-industrial,
# archvis-residential, simready, marbles, samples), a part per asset,
# each 'type: usd', built by PartCAD's own part type of that name.
name: //pub/collection/openusd/nvidia

desc: |
  NVIDIA's Omniverse sample content (the 'Example Assets' openusd.org lists)
  as PartCAD parts: the ArchVis commercial, industrial and residential props,
  the SimReady props, the Marbles demo's assets and the sample scenes. No
  geometry is vendored: every asset is fetched from NVIDIA's public bucket when
  it is first built, under the NVIDIA Omniverse License Agreement (see the
  README).
url: https://docs.omniverse.nvidia.com/usd/latest/usd_content_samples/downloadable_packs.html

# The first release whose //builtin has the 'usd' part type every part here
# is.
partcad: ">=0.9.6"

# Made to be looked at, rendered or simulated: nothing in them says they are
# made to be manufactured. The plugin says the same of 'assets'.
manufacturable: false

docs:
  name: NVIDIA's Omniverse sample content for PartCAD
  usage: |
    ```shell
    pc list parts //pub/collection/openusd/nvidia/assets/archvis-industrial
    pc search parts -P '//pub/collection/openusd/nvidia/assets...' -k pallet
    pc inspect //pub/collection/openusd/nvidia/assets/archvis-industrial:Pallet_A1
    ```

dependencies:
  assets:
    type: external
    plugin: :nvidia_repo
    desc: NVIDIA's Omniverse sample content, a child package per kind of asset and a part per asset.

repositories:
  nvidia_repo:
    type: basic
    path: nvidia_repo.py
    desc: Serves NVIDIA's Omniverse sample content as 'usd' parts.
    # Every parameter here is yours to change without touching this package,
    # in your own ~/.partcad/config.yaml, under 'parameters', by the plugin's
    # name ('//pub/collection/openusd/nvidia:nvidia_repo'), or - all but what says it is
    # yours alone - in a package of your own, with an enrich of the plugin
    # (see the README).
    parameters:
      textures:
        type: bool
        default: false
        desc: >-
          Whether a part's USDZ carries the asset's textures too. PartCAD
          builds a part from its geometry, so they are left out unless you
          want the package complete - to open it in another USD application,
          say.
      max_size_mb:
        type: float
        default: 512
        desc: >-
          The most a part's USDZ may be, in MB: it crosses to PartCAD in one
          answer. An asset found to be larger is refused, saying so, before
          the rest of it is fetched.
